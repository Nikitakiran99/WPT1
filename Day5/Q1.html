<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        h1,
        h2 {
            text-align: center;
        }

        #formContainer {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        textarea {
            width: 300px;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin: 10px;
            padding: 8px 16px;
            background-color: 0#475f47;
            color: #332626;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6a776b;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 20px;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #5d745e;
            color: #fff;
        }
    </style>
</head>

<body>
    <h2>User Data Management</h2>
    <div id="formContainer">
    
        Name:<input type="text" id="nameInput" placeholder="Enter Name...">
        <br>
        Email ID:<input type="email" id="emailInput" placeholder="Enter Email...">
        <br>
        Mobile Details:<input type="text" id="numberInput" placeholder="Enter Mobile Details...">
        <br>
        Address:<textarea id="addressInput" placeholder="Enter Address..."></textarea>
        <br>
        <br>
        <button onclick="addData()">Add</button>
    </div>

    <table id="outputTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile Details</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
    </table>

</body>

<script>
    function addData() {
        // Get input values
        let name = document.getElementById("nameInput").value;
        let email = document.getElementById("emailInput").value;
        let mobile = document.getElementById("numberInput").value;
        let address = document.getElementById("addressInput").value;

        // Perform validation: Check if any field is empty after trimming whitespace
        if (name.trim() === '' || email.trim() === '' || mobile.trim() === '' || address.trim() === '') {
            alert("Please fill in all the fields before adding data.");
            return; // Exit the function to prevent adding empty data
        }

        // Get the table and insert a new row at the end
        let table = document.getElementById("outputTable");
        let newRow = table.insertRow(table.rows.length);

        // Insert data into cells of the new row
        newRow.insertCell(0).innerHTML = name;
        newRow.insertCell(1).innerHTML = email;
        newRow.insertCell(2).innerHTML = mobile;
        newRow.insertCell(3).innerHTML = address;
        newRow.insertCell(4).innerHTML =
            '<button onclick="editData(this)">Edit</button>' +
            '<button onclick="deleteData(this)">Delete</button>';

        // Clear input fields
        clearInputs();
    }

    function editData(button) {
        let row = button.parentNode.parentNode;
        let nameCell = row.cells[0];
        let emailCell = row.cells[1];
        let mobileCell = row.cells[2];
        let addressCell = row.cells[3];

        let nameInput = prompt("Enter the updated name:", nameCell.innerHTML);
        let emailInput = prompt("Enter the updated email:", emailCell.innerHTML);
        let numberInput = prompt("Enter the updated mobile details:", mobileCell.innerHTML);
        let addressInput = prompt("Enter the updated address:", addressCell.innerHTML);
        
        // Add a check to prevent updating with empty values
        if (nameInput.trim() === '' || emailInput.trim() === '' || numberInput.trim() === '' || addressInput.trim() === '') {
            alert("Update cancelled. All fields must be filled.");
            return;
        }

        nameCell.innerHTML = nameInput;
        emailCell.innerHTML = emailInput;
        mobileCell.innerHTML = numberInput;
        addressCell.innerHTML = addressInput;
    }

    function deleteData(button) {
        let row = button.parentNode.parentNode;
        row.parentNode.removeChild(row);
    }

    function clearInputs() {
        document.getElementById("nameInput").value = "";
        document.getElementById("emailInput").value = "";
        document.getElementById("numberInput").value = "";
        document.getElementById("addressInput").value = "";
    }
</script>

</html>
