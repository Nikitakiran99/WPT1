<!DOCTYPE html>
<html>
<head>
  <title>Print Text on Multiple Lines</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

<button id="clickMe" style="cursor:pointer; ">🙋‍♂️ Click Me 🙋‍♂️</button>
<p id="output"></p>

<script>
  $(document).ready(function(){
    $("#clickMe").click(function(){
      const multiLineText = "This is line 1.\nThis is line 2.\nThis is line 3.";
    
      $("#output").html(multiLineText.replace(/\n/g, "<br>"));
    });
  });
</script>

</body>
</html>
