<!DOCTYPE html>
<html>
<head>
  <title>Input Transfer and Text Styling</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

<input type="text" id="input1" placeholder="Enter text here" />
<br><br>
<button id= "displayBtn" >Display</button>

<p id="italicText"></p>
<p id="underlineText"></p>

<script>
  $(document).ready(function() {
    $("#displayBtn").click(function() {
      let val = $("#input1").val();

      //  italics
      $("#italicText").text(val).css("font-style", "italic");

      //  underlined
      $("#underlineText").text(val).css("text-decoration", "underline");
    });
  });
</script>

</body>
</html>
