<!DOCTYPE html>
<html>
<head>
  <title>Simple Multiplication Table</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

Number: <input type="text" id="num" />
From: <input type="text" id="from" />
To: <input type="text" id="to" />
<button id="show">Show</button>

<div id="result"></div>

<script>
  $(function() {
    $("#show").click(function() {
      let num = parseInt($("#num").val());
      let from = parseInt($("#from").val());
      let to = parseInt($("#to").val());

      if (isNaN(num) || isNaN(from) || isNaN(to) || from > to) {
        $("#result").html("Please enter valid numbers with 'from' less than or equal to 'to'.");
        return;
      }

      let table = "<table border='1'><tr><th>Expression</th><th>Result</th></tr>";
      for(let i = from; i <= to; i++) {
        table += "<tr><td>" + num + " * " + i + " =</td><td>" + (num * i) + "</td></tr>";
      }
      table += "</table>";

      $("#result").html(table);
    });
  });
</script>

</body>
</html>
