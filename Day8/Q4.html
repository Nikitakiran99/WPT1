<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predifined Validation</title>
</head>
<body>
    <h2>Validation Form</h2>
    <form>
        <label for="name">Name </label><br>
        <input type="text" id="name" name="name" required minlength="3" maxlenght="10"/><br><br>
    
    <label for="password">Password (required, at least 6 characters):</label><br>
    <input type="password" id="password" name="password" required minlength="6" maxlenght="10"/><br><br>

    <input type="submit" value="Submit" />
    



    </form>
    
</body>
</html>
