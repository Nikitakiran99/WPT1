<!DOCTYPE html>
<html>
<body>
    <button onclick="showData()">Data From File</button>
    <div id="result"></div>
</body>

<script>
    function showData() {
        let request = new XMLHttpRequest();
        request.open("GET", "https://jsonplaceholder.typicode.com/posts", true); // Only keep the JSON API
        request.send();

        request.onload = function () { 
            if (this.status == 200) {
                let dataJson = this.responseText;
                let r = JSON.parse(dataJson);
                
                //Build table HTML for id and title
                let table = "<table border='1'><tr><th>ID</th><th>Title</th></tr>";
                for (let i = 0; i < r.length; i++) {
                    table += "<tr><td>" + r[i].id + "</td><td>" + r[i].title + "</td></tr>";
                }
                table += "</table>";

                document.getElementById("result").innerHTML = table;
            }
        }
    }
</script>
</html>
