<html>
<head>

</head>

<body>

    <p id="p1"></p>

    <input type="text" id="n">
    <button type="button" onclick="addatend()"> add at end </button>
    <button type="button" onclick="addAtStart()"> add at start</button>
    <button type="button" onclick="deleteend()"> delete from end</button>
    <button type="button" onclick="deletestart()"> delete from start</button>
    <button type="button" onclick="oddno()"> display odd numbers </button>
    <button type="button" onclick="evenno()"> display even numbers </button>


</body>
<script>
 const a = [];

 function addatend(){
    let d = document.getElementById("n").value;
    a.push(d);
    console.log(a);
    show();
 }

  function addAtStart(){
    let d = document.getElementById("n").value;
    a.unshift(d);
    console.log(a);
    show();
 }

 function deleteend(){
    let d = document.getElementById("n").value;
    a.pop(d);
    console.log(a);
    show();
 }

 function deletestart(){
    let d = document.getElementById("n").value;
    a.shift(d);
    console.log(a);
    show();
 }

 function oddno(){
    let d = document.getElementById("n").value;
    a.odd(d);
    console.log(a);
    show();
 }

function evenno(){
    let d = document.getElementById("n").value;
    a.even(d);
    console.log(a);
    show();
 }

function show(){
document.getElementById("p1").innerHTML = a
}
</script>










</html>
