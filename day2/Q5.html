<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HTML Selectors -->
    <input type="text" placeholder="Input Field">
    <p>This is a paragraph styled using an HTML selector.</p>
    <select>
        <option>Option 1</option>
        <option>Option 2</option>
    </select>

    <!-- Class Selectors -->
    <div class="moderate">This is styled with the "moderate" class.</div>
    <div class="gaudy">This is styled with the "gaudy" class.</div>

    <!-- ID Selector -->
    <div id="id1">This is styled with the "id1" ID.</div>
</body>
</html>
